services:
  reverse-tunnel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reverse-tunnel
    restart: unless-stopped
    environment:
      # Client configuration file (copied into image during build)
      - CLIENT_CONFIG=/app/client.yml

      # Target host for port forwarding (use 'localhost' for host network mode)
      - TARGET_HOST=localhost

      # Logging directory
      - LOG_DIR=/app/logs
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs
    network_mode: host
    # Use host network mode to access host.docker.internal
    # Alternative: use extra_hosts if not using host network mode
    extra_hosts:
      - "host.docker.internal:host-gateway"


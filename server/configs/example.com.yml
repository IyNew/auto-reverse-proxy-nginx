# Domain configuration for example.com
# This file defines nginx locations and HTTPS settings for a single domain

# The domain name - used as nginx server_name and config filename
domain_name: example.com

# HTTP port (default: 80)
listen_port: 80

# Define location blocks that map URL paths to backend ports
# Each location will be created as a nginx location block
#
# IMPORTANT: Trailing slash in 'path' affects URL proxying behavior
#
# With trailing slash (path: /app1/):
#   Request: /app1/users  → Backend receives: /users (path stripped)
#   Use this when your app expects requests at root path (e.g., Flask/FastAPI)
#
# Without trailing slash (path: /app1):
#   Request: /app1/users  → Backend receives: /app1/users (full path preserved)
#   Use this when your app handles the full path
#
locations:
  app1:
    # With trailing slash - backend sees stripped path
    path: /app1/
    backend_port: 8000
    # Optional: Set maximum allowed body size for uploads (e.g., 10M, 1G)
    # client_max_body_size: 50M

  app2:
    # Without trailing slash - backend sees full path
    path: /app2
    backend_port: 8090

  # Example: Root path serves a main application
  # root:
  #   path: /
  #   backend_port: 3000

# HTTPS/SSL configuration
https:
  # Enable HTTPS with Let's Encrypt certificates
  enabled: true

  # Email for certificate expiration notices
  email: admin@example.com

  # Include www subdomain in the certificate
  # If true, both example.com and www.example.com will be included
  www_domain: true

  # Force certificate renewal (useful for testing)
  force_renew: false
